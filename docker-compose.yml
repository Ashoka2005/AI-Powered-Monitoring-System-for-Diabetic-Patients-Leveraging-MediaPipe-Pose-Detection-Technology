version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: diafit-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: diafit_ai
    networks:
      - diafit-network

  backend:
    build: ./backend
    container_name: diafit-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/diafit_ai
      - JWT_SECRET=your-production-jwt-secret-change-this
      - JWT_REFRESH_SECRET=your-production-refresh-secret-change-this
      - ML_SERVICE_URL=http://ml-service:5001
      - PORT=5000
    depends_on:
      - mongodb
    networks:
      - diafit-network

  ml-service:
    build: ./ml-service
    container_name: diafit-ml-service
    restart: unless-stopped
    ports:
      - "5001:5001"
    networks:
      - diafit-network

  frontend:
    build: ./frontend
    container_name: diafit-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - diafit-network

volumes:
  mongo_data:

networks:
  diafit-network:
    driver: bridge
