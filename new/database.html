<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Database Viewer - Health Monitor</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
      min-height: 100vh;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
      background: white;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    h1 {
      color: #667eea;
      margin-bottom: 10px;
    }
    .nav {
      margin-bottom: 20px;
    }
    .nav a {
      display: inline-block;
      background: #667eea;
      color: white;
      padding: 10px 20px;
      text-decoration: none;
      border-radius: 5px;
      margin-right: 10px;
      transition: all 0.3s;
    }
    .nav a:hover {
      background: #5568d3;
    }
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 2px solid #e0e0e0;
    }
    .tab {
      padding: 12px 24px;
      background: #f8f9fa;
      border: none;
      border-radius: 8px 8px 0 0;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
    }
    .tab.active {
      background: #667eea;
      color: white;
    }
    .tab:hover {
      background: #e0e0e0;
    }
    .tab.active:hover {
      background: #5568d3;
    }
    .content {
      display: none;
    }
    .content.active {
      display: block;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #e0e0e0;
    }
    th {
      background: #667eea;
      color: white;
      font-weight: 600;
      position: sticky;
      top: 0;
    }
    tr:hover {
      background: #f8f9fa;
    }
    .count {
      background: #e8f5e9;
      padding: 10px 15px;
      border-radius: 8px;
      display: inline-block;
      margin-bottom: 15px;
      font-weight: 600;
      color: #2e7d32;
    }
    .loading {
      text-align: center;
      padding: 40px;
      color: #667eea;
      font-size: 18px;
    }
    .error {
      background: #ffebee;
      color: #c62828;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      line-height: 1.6;
    }
    .error small {
      display: block;
      margin-top: 10px;
      color: #d32f2f;
      font-size: 13px;
    }
    .error code {
      background: #fff;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: 'Courier New', monospace;
    }
    .success {
      background: #e8f5e9;
      color: #2e7d32;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
    }
    .json-view {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 8px;
      overflow-x: auto;
      max-height: 600px;
      overflow-y: auto;
    }
    pre {
      margin: 0;
      font-family: 'Courier New', monospace;
      font-size: 13px;
    }
    .refresh-btn {
      background: #4caf50;
      color: white;
      padding: 10px 25px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.3s;
    }
    .refresh-btn:hover {
      background: #45a049;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🗄️ MongoDB Database Viewer</h1>
    <p style="color: #666; margin-bottom: 20px;">View all stored data from MongoDB Atlas</p>
    
    <div class="nav">
      <a href="index.html">← Back to App</a>
      <a href="dashboard.html">📊 Dashboard</a>
      <button class="refresh-btn" onclick="loadAllData()">🔄 Refresh All Data</button>
    </div>

    <div id="connectionStatus"></div>

    <div class="tabs">
      <button class="tab active" onclick="showTab('users')">👥 Users</button>
      <button class="tab" onclick="showTab('sessions')">🏋️ Sessions</button>
      <button class="tab" onclick="showTab('bmi')">⚖️ BMI Records</button>
      <button class="tab" onclick="showTab('progress')">📈 Progress</button>
      <button class="tab" onclick="showTab('all')">📊 All Data (JSON)</button>
    </div>

    <div id="users" class="content active">
      <h2>Users Collection</h2>
      <div id="users-content">
        <div class="loading">Loading...</div>
      </div>
    </div>

    <div id="sessions" class="content">
      <h2>Exercise Sessions Collection</h2>
      <div id="sessions-content">
        <div class="loading">Loading...</div>
      </div>
    </div>

    <div id="bmi" class="content">
      <h2>BMI Records Collection</h2>
      <div id="bmi-content">
        <div class="loading">Loading...</div>
      </div>
    </div>

    <div id="progress" class="content">
      <h2>Progress Tracking Collection</h2>
      <div id="progress-content">
        <div class="loading">Loading...</div>
      </div>
    </div>

    <div id="all" class="content">
      <h2>Complete Database (JSON Format)</h2>
      <div id="all-content">
        <div class="loading">Loading...</div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:3000/api';

    function showTab(tabName) {
      // Hide all content
      document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      
      // Show selected content
      document.getElementById(tabName).classList.add('active');
      event.target.classList.add('active');
    }

    async function loadUsers() {
      try {
        const res = await fetch(`${API_URL}/view/users`);
        const data = await res.json();
        
        const content = document.getElementById('users-content');
        
        if (!data.success) {
          content.innerHTML = `<div class="error">${data.message || 'Failed to load users'}</div>`;
          return;
        }

        if (data.users.length === 0) {
          content.innerHTML = '<div class="error">No users found in database</div>';
          return;
        }

        let html = `<div class="count">Total Users: ${data.count}</div>`;
        html += '<table><thead><tr><th>Name</th><th>Email</th><th>Age</th><th>Gender</th><th>Created At</th><th>Actions</th></tr></thead><tbody>';
        
        data.users.forEach(user => {
          html += `<tr>
            <td><strong>${user.name || 'N/A'}</strong></td>
            <td>${user.email}</td>
            <td>${user.age || 'N/A'}</td>
            <td>${user.gender || 'N/A'}</td>
            <td>${new Date(user.createdAt).toLocaleString()}</td>
            <td>
              <button onclick="viewUserSessions('${user._id}', '${user.name}')" 
                style="background: #667eea; color: white; padding: 6px 12px; border: none; border-radius: 5px; cursor: pointer; font-size: 12px; margin-right: 5px;">
                📊 View Sessions
              </button>
              <button onclick="deleteUser('${user._id}', '${user.name}')" 
                style="background: #f44336; color: white; padding: 6px 12px; border: none; border-radius: 5px; cursor: pointer; font-size: 12px;">
                🗑️ Delete
              </button>
            </td>
          </tr>`;
        });
        
        html += '</tbody></table>';
        content.innerHTML = html;
      } catch (error) {
        document.getElementById('users-content').innerHTML = 
          `<div class="error">Error: ${error.message}</div>`;
      }
    }

    async function loadSessions() {
      try {
        const res = await fetch(`${API_URL}/view/sessions`);
        const data = await res.json();
        
        const content = document.getElementById('sessions-content');
        
        if (!data.success) {
          content.innerHTML = `<div class="error">${data.message || 'Failed to load sessions'}</div>`;
          return;
        }

        if (data.sessions.length === 0) {
          content.innerHTML = '<div class="error">No sessions found in database</div>';
          return;
        }

        let html = `<div class="count">Total Sessions: ${data.count}</div>`;
        html += '<table><thead><tr><th>Date</th><th>Exercise</th><th>Condition</th><th>Reps</th><th>Accuracy</th><th>Duration</th><th>User</th><th>Actions</th></tr></thead><tbody>';
        
        data.sessions.forEach(session => {
          html += `<tr>
            <td>${new Date(session.timestamp).toLocaleString()}</td>
            <td>${session.asanaName}</td>
            <td>${session.condition}</td>
            <td>${session.reps || 0}</td>
            <td>${session.accuracy ? session.accuracy.toFixed(1) + '%' : 'N/A'}</td>
            <td>${session.duration}s</td>
            <td><code style="font-size: 10px;">${session.userId}</code></td>
            <td>
              <button onclick="deleteSession('${session._id}')" 
                style="background: #f44336; color: white; padding: 6px 12px; border: none; border-radius: 5px; cursor: pointer; font-size: 12px;">
                🗑️ Delete
              </button>
            </td>
          </tr>`;
        });
        
        html += '</tbody></table>';
        content.innerHTML = html;
      } catch (error) {
        document.getElementById('sessions-content').innerHTML = 
          `<div class="error">Error: ${error.message}</div>`;
      }
    }

    async function loadBMI() {
      try {
        const res = await fetch(`${API_URL}/view/bmi`);
        const data = await res.json();
        
        const content = document.getElementById('bmi-content');
        
        if (!data.success) {
          content.innerHTML = `<div class="error">${data.message || 'Failed to load BMI records'}</div>`;
          return;
        }

        if (data.bmi.length === 0) {
          content.innerHTML = '<div class="error">No BMI records found in database</div>';
          return;
        }

        let html = `<div class="count">Total BMI Records: ${data.count}</div>`;
        html += '<table><thead><tr><th>Date</th><th>Weight (kg)</th><th>Height (m)</th><th>BMI</th><th>Category</th><th>User</th><th>Actions</th></tr></thead><tbody>';
        
        data.bmi.forEach(record => {
          html += `<tr>
            <td>${new Date(record.timestamp).toLocaleString()}</td>
            <td>${record.weight}</td>
            <td>${record.height}</td>
            <td><strong>${record.bmi}</strong></td>
            <td>${record.category}</td>
            <td><code style="font-size: 10px;">${record.userId}</code></td>
            <td>
              <button onclick="deleteBMI('${record._id}')" 
                style="background: #f44336; color: white; padding: 6px 12px; border: none; border-radius: 5px; cursor: pointer; font-size: 12px;">
                🗑️ Delete
              </button>
            </td>
          </tr>`;
        });
        
        html += '</tbody></table>';
        content.innerHTML = html;
      } catch (error) {
        document.getElementById('bmi-content').innerHTML = 
          `<div class="error">Error: ${error.message}</div>`;
      }
    }

    async function loadProgress() {
      try {
        const res = await fetch(`${API_URL}/view/progress`);
        const data = await res.json();
        
        const content = document.getElementById('progress-content');
        
        if (!data.success) {
          content.innerHTML = `<div class="error">${data.message || 'Failed to load progress'}</div>`;
          return;
        }

        if (data.progress.length === 0) {
          content.innerHTML = '<div class="error">No progress records found in database</div>';
          return;
        }

        let html = `<div class="count">Total Progress Records: ${data.count}</div>`;
        html += '<table><thead><tr><th>User ID</th><th>Condition</th><th>Total Sessions</th><th>Total Reps</th><th>Avg Accuracy</th><th>Last Updated</th><th>Actions</th></tr></thead><tbody>';
        
        data.progress.forEach(prog => {
          html += `<tr>
            <td><code style="font-size: 10px;">${prog.userId}</code></td>
            <td>${prog.condition}</td>
            <td>${prog.totalSessions}</td>
            <td>${prog.totalReps}</td>
            <td>${prog.averageAccuracy.toFixed(1)}%</td>
            <td>${new Date(prog.lastUpdated).toLocaleString()}</td>
            <td>
              <button onclick="deleteProgress('${prog._id}')" 
                style="background: #f44336; color: white; padding: 6px 12px; border: none; border-radius: 5px; cursor: pointer; font-size: 12px;">
                🗑️ Delete
              </button>
            </td>
          </tr>`;
        });
        
        html += '</tbody></table>';
        content.innerHTML = html;
      } catch (error) {
        document.getElementById('progress-content').innerHTML = 
          `<div class="error">Error: ${error.message}</div>`;
      }
    }

    async function loadAll() {
      try {
        const res = await fetch(`${API_URL}/view/all`);
        const data = await res.json();
        
        const content = document.getElementById('all-content');
        
        if (!data.success) {
          content.innerHTML = `<div class="error">${data.message || 'Failed to load data'}</div>`;
          return;
        }

        const html = `
          <div class="success">Database connected successfully!</div>
          <div class="json-view">
            <pre>${JSON.stringify(data.data, null, 2)}</pre>
          </div>
        `;
        content.innerHTML = html;
      } catch (error) {
        document.getElementById('all-content').innerHTML = 
          `<div class="error">Error: ${error.message}</div>`;
      }
    }

    async function checkConnection() {
      try {
        const res = await fetch(`${API_URL}/view/users`);
        const data = await res.json();
        const status = document.getElementById('connectionStatus');
        
        if (data.success) {
          status.innerHTML = '<div class="success">✅ Connected to MongoDB - Data available</div>';
        } else {
          status.innerHTML = `<div class="error">⚠️ ${data.message || 'Database not connected'}<br>
          <small>The app will work, but no data will be saved. To enable database:<br>
          1. Ensure MongoDB Atlas connection string is correct in .env file<br>
          2. Check if MongoDB cluster is active</small></div>`;
        }
      } catch (error) {
        document.getElementById('connectionStatus').innerHTML = 
          `<div class="error">❌ Cannot connect to backend server<br>
          <small>Please ensure the server is running on http://localhost:3000<br>
          Run: <code>npm start</code> in the project folder</small><br>
          Error: ${error.message}</div>`;
      }
    }

    async function loadAllData() {
      await checkConnection();
      await loadUsers();
      await loadSessions();
      await loadBMI();
      await loadProgress();
      await loadAll();
    }

    // Load all data on page load
    window.addEventListener('load', loadAllData);

    // View sessions for a specific user
    async function viewUserSessions(userId, userName) {
      try {
        const res = await fetch(`${API_URL}/sessions/${userId}`);
        const data = await res.json();
        
        if (!data.success || data.sessions.length === 0) {
          alert(`No sessions found for ${userName}`);
          return;
        }
        
        // Switch to sessions tab
        showTab('sessions');
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab')[1].classList.add('active');
        
        const content = document.getElementById('sessions-content');
        let html = `<div class="count">Sessions for: <strong>${userName}</strong> (${data.sessions.length} total)</div>`;
        html += `<button onclick="loadSessions()" style="margin-bottom: 15px; background: #667eea; color: white; padding: 8px 16px; border: none; border-radius: 5px; cursor: pointer;">← Back to All Sessions</button>`;
        html += '<table><thead><tr><th>Date</th><th>Exercise</th><th>Condition</th><th>Reps</th><th>Accuracy</th><th>Duration</th><th>Actions</th></tr></thead><tbody>';
        
        data.sessions.forEach(session => {
          html += `<tr>
            <td>${new Date(session.timestamp).toLocaleString()}</td>
            <td>${session.asanaName}</td>
            <td>${session.condition}</td>
            <td>${session.reps || 0}</td>
            <td>${session.accuracy ? session.accuracy.toFixed(1) + '%' : 'N/A'}</td>
            <td>${session.duration}s</td>
            <td>
              <button onclick="deleteSession('${session._id}')" 
                style="background: #f44336; color: white; padding: 6px 12px; border: none; border-radius: 5px; cursor: pointer; font-size: 12px;">
                🗑️ Delete
              </button>
            </td>
          </tr>`;
        });
        
        html += '</tbody></table>';
        content.innerHTML = html;
      } catch (error) {
        alert('Error loading user sessions: ' + error.message);
      }
    }

    // Delete a session
    async function deleteSession(sessionId) {
      if (!confirm('Are you sure you want to delete this session? This cannot be undone.')) {
        return;
      }
      
      try {
        const res = await fetch(`${API_URL}/sessions/${sessionId}`, {
          method: 'DELETE'
        });
        const data = await res.json();
        
        if (data.success) {
          alert('✅ Session deleted successfully!');
          loadAllData();
        } else {
          alert('❌ Failed to delete session: ' + (data.error || 'Unknown error'));
        }
      } catch (error) {
        alert('❌ Error deleting session: ' + error.message);
      }
    }

    // Delete a user
    async function deleteUser(userId, userName) {
      if (!confirm(`Are you sure you want to delete user "${userName}"?

This will also delete:
- All their sessions
- All their BMI records
- All their progress data

This cannot be undone!`)) {
        return;
      }
      
      try {
        const res = await fetch(`${API_URL}/users/${userId}`, {
          method: 'DELETE'
        });
        const data = await res.json();
        
        if (data.success) {
          alert(`✅ User "${userName}" and all associated data deleted successfully!`);
          loadAllData();
        } else {
          alert('❌ Failed to delete user: ' + (data.error || 'Unknown error'));
        }
      } catch (error) {
        alert('❌ Error deleting user: ' + error.message);
      }
    }

    // Delete a BMI record
    async function deleteBMI(bmiId) {
      if (!confirm('Are you sure you want to delete this BMI record? This cannot be undone.')) {
        return;
      }
      
      try {
        const res = await fetch(`${API_URL}/bmi/${bmiId}`, {
          method: 'DELETE'
        });
        const data = await res.json();
        
        if (data.success) {
          alert('✅ BMI record deleted successfully!');
          loadAllData();
        } else {
          alert('❌ Failed to delete BMI record: ' + (data.error || 'Unknown error'));
        }
      } catch (error) {
        alert('❌ Error deleting BMI record: ' + error.message);
      }
    }

    // Delete a progress record
    async function deleteProgress(progressId) {
      if (!confirm('Are you sure you want to delete this progress record? This cannot be undone.')) {
        return;
      }
      
      try {
        const res = await fetch(`${API_URL}/progress/${progressId}`, {
          method: 'DELETE'
        });
        const data = await res.json();
        
        if (data.success) {
          alert('✅ Progress record deleted successfully!');
          loadAllData();
        } else {
          alert('❌ Failed to delete progress record: ' + (data.error || 'Unknown error'));
        }
      } catch (error) {
        alert('❌ Error deleting progress record: ' + error.message);
      }
    }
  </script>
</body>
</html>
